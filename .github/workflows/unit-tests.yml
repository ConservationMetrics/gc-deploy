name: Unit tests

on:
  push:

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gc-stack-deploy unit tests
        run: make -C caprover/tests test-unit
